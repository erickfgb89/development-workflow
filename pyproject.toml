[project]
name = "overture"
version = "0.1.0"
description = "AI-driven workflow orchestrator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.0.14",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]

[project.scripts]
overture = "overture.__main__:main"

[tool.zipapp]
output = "overture.pyz"
main = "overture.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
