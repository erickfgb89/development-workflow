[project]
name = "overture"
version = "0.1.0"
description = "AI-driven workflow orchestrator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.0.14",
    "jsonschema>=4.23.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]

[project.scripts]
overture = "overture.__main__:main"

[tool.zipapp]
output = "overture.pyz"
main = "overture.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/overture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-playwright>=0.5",
    "httpx>=0.27",
    "anyio>=4",
]
